[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-sanitizer-agent"
version = "0.1.0"
description = "Fail-closed PII redaction library, CLI and prompt-sanitizing agent wrapper (pure standard library, offline)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prudhvi Kolla" }]
keywords = ["pii", "redaction", "privacy", "sanitization", "llm-safety"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Text Processing",
]

[project.scripts]
pii-sanitizer = "pii_sanitizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
